name: Build & Package Extension Releases

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package Extension (.zip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension (Chrome & Firefox)
        run: npm run build

      - name: Package Extension Zips
        run: node scripts/package-extension.js

      - name: Upload Firefox Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uaiselect-firefox
          path: releases/uaiselect-firefox.zip

      - name: Upload Chrome Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uaiselect-chrome
          path: releases/uaiselect-chrome.zip

  create-github-release:
    name: Create GitHub Release with Store Zips
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Firefox Zip
        uses: actions/download-artifact@v4
        with:
          name: uaiselect-firefox
          path: releases/

      - name: Download Chrome Zip
        uses: actions/download-artifact@v4
        with:
          name: uaiselect-chrome
          path: releases/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg_version.outputs.version }}
          name: Release v${{ steps.pkg_version.outputs.version }}
          files: |
            releases/uaiselect-firefox.zip
            releases/uaiselect-chrome.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
